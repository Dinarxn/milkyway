<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milky Way 3D — Photorealistic Astrophysical Visualization</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #03060d;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #webgl-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
      }
      #hud-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
      }
      .hud-interactive {
        pointer-events: auto;
      }
      #hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .hud-panel {
        background: rgba(10, 16, 28, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 8px;
        padding: 12px 18px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      }
      #hud-title h1 {
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #38bdf8;
      }
      #hud-title p {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-top: 2px;
      }
      #hud-telemetry {
        font-family: monospace;
        font-size: 0.8rem;
        color: #38bdf8;
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #hud-center-content {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }
      #hud-landmark-card {
        max-width: 380px;
        display: none;
      }
      #hud-landmark-card.active {
        display: block;
      }
      #hud-bookmark-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 8px;
      }
      .bookmark-btn {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(56, 189, 248, 0.25);
        color: #e2e8f0;
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 0.78rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .bookmark-btn:hover {
        background: rgba(56, 189, 248, 0.2);
        border-color: #38bdf8;
        color: #ffffff;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-aWn9rpCP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CpGE7ygd.css">
  </head>
  <body>
    <canvas id="webgl-canvas"></canvas>

    <div id="hud-container">
      <header id="hud-header">
        <div id="hud-title" class="hud-panel hud-interactive">
          <h1>Milky Way 3D</h1>
          <p>Astrophysical Data & Coordinate Visualization</p>
        </div>
        <div id="hud-telemetry" class="hud-panel hud-interactive">
          <div id="telemetry-fps">60 FPS</div>
          <div id="telemetry-particles">250,000 Stars</div>
          <div id="telemetry-camera">Coord: (0, 45k, 75k) ly</div>
        </div>
      </header>

      <main id="hud-center-content">
        <div id="hud-landmark-card" class="hud-panel hud-interactive">
          <!-- Landmark scientific data card will be populated here -->
        </div>
      </main>

      <footer id="hud-footer">
        <nav id="hud-bookmark-bar" class="hud-interactive">
          <!-- Landmark bookmark navigation buttons -->
        </nav>
      </footer>
    </div>

  </body>
</html>
